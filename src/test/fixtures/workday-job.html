     Every field this adapter reads comes out of the head.

     verbatim. Workday appends a counter to the URL slug that is not part of the
     requisition, and this disagreement is why `extractAtsReqId` strips it — so
     that a record saved through this adapter and one saved from the URL alone
     land on the same key. `ats.test.ts` asserts the two agree about this URL.

     `jobLocationType` is absent — checked on both captured postings — so
     `Workforce Classification: Hybrid` is the only thing on the page that says
     it. The prefix is kept intact for that reason.

  4. **The salary is prose and `baseSalary` is null.** Also verbatim, and also
     checked on both postings. Washington requires a range in the posting and
     Premera puts it in the description text, where `salary.ts` deliberately
     does not go. The tail of the description is kept so that a future change of
     heart about prose salary has the real phrasing to work against, and so that
